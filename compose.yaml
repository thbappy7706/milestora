services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/milestora'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8070}:80'
            - '${VITE_PORT:-5175}:${VITE_PORT:-5175}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - milestora
        depends_on:
            - mysql
            - redis
            - mailpit

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-33063}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'milestora-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - milestora
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    phpmyadmin:
        image: phpmyadmin:latest
        restart: unless-stopped
        ports:
            - '${FORWARD_PMA_PORT:-8071}:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            UPLOAD_LIMIT: 512M
        depends_on:
            - mysql
        networks:
            - milestora

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-16382}:6379'
        volumes:
            - 'milestora-redis:/data'
        networks:
            - milestora
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILPIT_PORT:-11036}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8072}:8025'
        networks:
            - milestora

networks:
    milestora:
        driver: bridge

volumes:
    milestora-mysql:
        driver: local
    milestora-redis:
        driver: local